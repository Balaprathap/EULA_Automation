name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - lint, types, tests
    runs-on: ubuntu-latest
    env:
      # No paid provider call is ever made in CI. The deterministic embedding
      # provider is offline, and every LLM call goes through a test double.
      ENVIRONMENT: test
      EMBEDDING_PROVIDER: deterministic
      EMBEDDING_DIMENSIONS: 128
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pglast

      - name: Ruff lint
        working-directory: backend
        run: ruff check app scripts tests

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check app scripts tests

      - name: Type check
        working-directory: backend
        run: mypy app || echo "::warning::mypy reported issues"

      - name: Tests
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Retrieval evaluation
        working-directory: backend
        run: python -m scripts.evaluate_retrieval

  migrations:
    name: Migrations - apply to a clean database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clauseguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        working-directory: backend
        run: pip install asyncpg

      - name: Create Supabase-compatible schemas
        env:
          PGPASSWORD: postgres
        run: |
          # Migrations reference auth.users / auth.uid() / storage.objects, which
          # Supabase provides. Recreate the minimum surface so the SQL can be
          # verified against a real PostgreSQL server in CI.
          psql -h localhost -U postgres -d clauseguard <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS auth.users (
              id uuid PRIMARY KEY,
              email text,
              raw_user_meta_data jsonb DEFAULT '{}'::jsonb
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
              LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE TABLE IF NOT EXISTS storage.buckets (
              id text PRIMARY KEY, name text, public boolean,
              file_size_limit bigint, allowed_mime_types text[]
          );
          CREATE TABLE IF NOT EXISTS storage.objects (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              bucket_id text, name text
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          CREATE OR REPLACE FUNCTION storage.foldername(name text) RETURNS text[]
              LANGUAGE sql IMMUTABLE AS $$ SELECT string_to_array(name, '/') $$;
          SQL

      - name: Apply migrations to an empty database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clauseguard
        run: python -m scripts.migrate

      - name: Apply again - migrations must be idempotent
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clauseguard
        run: python -m scripts.migrate

      - name: Seed the default policy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clauseguard
        run: python -m scripts.seed --demo

  frontend:
    name: Frontend - lint, types, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci || npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npm run build

  security:
    name: Security - secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python security scan
        working-directory: backend
        run: |
          pip install bandit pip-audit
          bandit -r app -ll -x tests || true
          pip-audit --strict || echo "::warning::pip-audit reported advisories"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit reported advisories"

      - name: Fail if a .env file is committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.' | grep -v '\.env\.example'; then
            echo "A .env file is committed. Remove it and rotate any exposed secrets."
            exit 1
          fi
