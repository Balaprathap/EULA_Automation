# Local development stack.
#
#   docker compose up --build          start everything
#   docker compose run --rm migrate    apply migrations (adds the local shim)
#   docker compose run --rm seed       seed the default policy
#   docker compose run --rm seed python -m scripts.seed --demo
#
# Postgres here runs the pgvector image so local development matches Supabase.
# Supabase Auth and Storage are cloud services and are configured via .env.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clauseguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clauseguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clauseguard
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      API_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Same image as the API, different command.
  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clauseguard
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.worker
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clauseguard
    depends_on:
      postgres:
        condition: service_healthy
    # --local-shim creates the auth/storage schemas Supabase normally provides.
    # It is refused automatically if DATABASE_URL points at a Supabase host.
    command: python -m scripts.migrate --local-shim
    profiles: ["tools"]

  seed:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clauseguard
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m scripts.seed --demo
    profiles: ["tools"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles: ["full"]

volumes:
  postgres_data:
  redis_data:
