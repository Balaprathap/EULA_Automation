[project]
name = "clauseguard-backend"
version = "1.0.0"
description = "Automated EULA Compliance Extraction - backend API and analysis worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "asyncpg>=0.30",
  "redis>=5.2",
  "anthropic>=0.40",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "PyJWT[crypto]>=2.9",
  "python-json-logger>=2.0",
  "tenacity>=9.0",
  "sentry-sdk>=2.18",
  "reportlab>=4.2",   # PDF report generation
  "boto3>=1.34",      # optional AWS S3 report storage + SES email (feature-flagged off)   # PDF report generation (email uses stdlib smtplib / httpx)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-redis",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = [
  "S101",   # assert: used throughout the test suite
  "B008",   # function call in default argument: the FastAPI Depends() idiom
  "S105",   # possible hardcoded password: false positives on field names
  "S106",   # possible hardcoded password argument: same
  "UP017",  # datetime.UTC is 3.11+; timezone.utc is equivalent and portable
  "UP042",  # str-Enum: explicit (str, Enum) subclassing is clearer here
  "B905",   # zip strict=: sequences are length-checked before zipping
  "E501",   # line length: enforced by ruff format, not by lint
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S603", "S607"]
# S608 (hardcoded SQL): every query in the repository layer interpolates only
# module-level constant column lists and allowlisted sort keys. All user input is
# passed as $n bind parameters - never string-formatted into SQL.
"app/db/repositories/*" = ["S608"]
"app/api/v1/usage.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
